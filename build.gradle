plugins {
    id 'java-library'
    id 'io.freefair.lombok' version "9.2.0"
}

wrapper {
    gradleVersion = '8.13'
}

group = 'guru.qa'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

def restAssuredVersion = "6.0.0",
    junitVersion = "5.14.3",
    slf4jVersion = "2.0.17",
    datafakerVersion = "2.5.4",
    jacksonVersion = "2.22.1",
    assertjVersion = "3.27.7"


dependencies {
    testImplementation(platform("org.junit:junit-bom:${junitVersion}"))
    testImplementation("io.rest-assured:rest-assured:$restAssuredVersion")
    testImplementation("io.rest-assured:json-schema-validator:$restAssuredVersion")

// Jackson (правильный groupId)
    testImplementation("com.fasterxml.jackson.core:jackson-databind:$jacksonVersion")

    testImplementation("net.datafaker:datafaker:$datafakerVersion")
// Без явной версии — возьмётся из BOM
    testImplementation("org.junit.jupiter:junit-jupiter-api")
    testImplementation("org.slf4j:slf4j-simple:$slf4jVersion")
    testImplementation("org.assertj:assertj-core:$assertjVersion")

// Опционально: движок и лаунчер будут подхватываться через BOM
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperties(System.getProperties())

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}